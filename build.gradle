buildscript {

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        google()
    }
    dependencies {
        
    }
}

allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"
	apply plugin: "distribution"

    version = '1.0'
    ext {
        appName = "Aboard"
        gdxVersion = '1.9.10'
        roboVMVersion = '2.3.5'
        box2DLightsVersion = '1.4'
        ashleyVersion = '1.7.0'
        aiVersion = '1.8.0'
        visuiVersion = '1.4.2'
        typingLabelVersion = '1.1.0'
        javaTarget = 21
        junitVersion = '5.14.4'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        google()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
}


tasks.withType(JavaExec) {
    if (System.getProperty('DEBUG', 'false') == 'true') {
        jvmArgs '-Xdebug', '-Xrunjdwp:transport=dt_socket,server=y,suspend=y,address=9099'
    }
}

// One toolchain for every module. Gradle provisions a JDK 21 if the machine has none,
// so the build no longer depends on whatever java happens to be on PATH.
allprojects {
    plugins.withType(JavaPlugin) {
        java {
            toolchain { languageVersion = JavaLanguageVersion.of(rootProject.ext.javaTarget) }
        }
        tasks.withType(JavaCompile) {
            options.encoding = 'UTF-8'
            options.release = rootProject.ext.javaTarget
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}


project(":desktop") {
    apply plugin: "java-library"

    dependencies {
        api project(":core")
     	api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-desktop"    
       
    }
}

project(":editor") {
    apply plugin: "java-library"

    dependencies {
        api project(":core")
        api project(":desktop")
    }
}

project(":test") {
    apply plugin: "java-library"

    dependencies {
        api project(":core")
        api project(":desktop")
        api project(":editor")
    }
}

project(":core") {
    apply plugin: "java-library"

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-controllers-lwjgl3:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
  		api "com.kotcrab.vis:vis-ui:$visuiVersion"
        api 'org.apache.commons:commons-collections4:4.1'
        api "com.badlogicgames.box2dlights:box2dlights:1.4"
     	api "com.esotericsoftware:kryo:5.0.0-RC1"
     	api "com.rafaskoberg.gdx:typing-label:$typingLabelVersion"
        api group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.0.1'
        api group: 'commons-io', name: 'commons-io', version: '2.4'
        api group: 'org.apache.commons', name: 'commons-io', version: '1.3.2'
        api fileTree(dir: 'jars', include: '*.jar')
    }
}

//https://github.com/rafaskb/typing-label/wiki/Tokens#custom-effects

tasks.eclipse.doLast {
    delete ".project"
}