buildscript {

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        google()
    }
    dependencies {
        
    }
}

// offscreen(task, when): windows nobody is meant to watch go to a headless display.
apply from: 'gradle/offscreen.gradle'
// exclusiveRun(task): one run of that task at a time in this checkout (r132).
apply from: 'gradle/testlock.gradle'

allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"
	apply plugin: "distribution"

    version = '1.0'
    ext {
        appName = "Aboard"
        gdxVersion = '1.14.2'
        controllersVersion = '2.2.4'
        visuiVersion = '1.5.9'
        textratypistVersion = '2.4.0'
        javaTarget = 21
        // The parallax renderer, which also owns the .plax format. It brings its own Kryo
        // (5.6.2) and reads the 2019 files written by kryo 5.0.0-RC1 itself - don't add a kryo.
        parallaxVersion = '2.1.0'
        junitVersion = '5.14.4'
    }

    // vis-ui and typing-label each declare their own libGDX version, and Gradle resolves
    // version conflicts by picking the highest. That silently upgraded the engine at runtime
    // while the compiler still saw the declared one - which is how a class that exists at
    // compile time went missing at run time. Pin it: the engine version is ours to choose.
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            // Only the artifacts released in lockstep with the engine. Helpers such as
            // gdx-jnigen-loader carry their own version and must be left alone.
            def lockstep = ['gdx', 'gdx-backend-lwjgl3', 'gdx-backend-headless',
                            'gdx-platform', 'gdx-freetype', 'gdx-freetype-platform']
            if (details.requested.group == 'com.badlogicgames.gdx'
                    && lockstep.contains(details.requested.name)) {
                details.useVersion gdxVersion
                details.because 'the libGDX version is set in one place only'
            }
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()
        google()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
}


tasks.withType(JavaExec) {
    if (System.getProperty('DEBUG', 'false') == 'true') {
        jvmArgs '-Xdebug', '-Xrunjdwp:transport=dt_socket,server=y,suspend=y,address=9099'
    }
}

// One toolchain for every module. Gradle provisions a JDK 21 if the machine has none,
// so the build no longer depends on whatever java happens to be on PATH.
allprojects {
    plugins.withType(JavaPlugin) {
        java {
            toolchain { languageVersion = JavaLanguageVersion.of(rootProject.ext.javaTarget) }
        }
        tasks.withType(JavaCompile) {
            options.encoding = 'UTF-8'
            options.release = rootProject.ext.javaTarget
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}


project(":desktop") {
    apply plugin: "java-library"

    dependencies {
        api project(":core")
        api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:$controllersVersion"
    }
}

project(":editor") {
    apply plugin: "java-library"

    dependencies {
        api project(":core")
        api project(":desktop")
    }
}

project(":test") {
    apply plugin: "java-library"

    dependencies {
        api project(":core")
        api project(":desktop")
        api project(":editor")
    }
}

project(":core") {
    apply plugin: "java-library"

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$controllersVersion"

        // No backend here: the browser build translates core (r135). What core needs of the
        // desktop - the window's position, files on disk - goes through jks.amain.Platform, and
        // CoreIsPortableTest fails the build on anything that slips back in.
        api "com.kotcrab.vis:vis-ui:$visuiVersion"
        // Replaces com.rafaskoberg.gdx:typing-label, whose last release (1.4.0) calls
        // com.badlogic.gdx.utils.StringBuilder - a class libGDX deleted in 1.14.0. This is
        // the maintained successor and tracks the current engine.
        api "com.github.tommyettinger:textratypist:$textratypistVersion"
        // No Jackson (r136): the .wa levels and the config are read with libGDX Json, which the
        // browser build can translate. CoreIsPortableTest fails the build on com.fasterxml.

        // Draws the carriage backdrops and reads their .plax files. Brings gdx (held to
        // gdxVersion by the lockstep above), kryo 5.6.2 and jackson-annotations.
        api "io.github.javakhanstudio:parallax-background:$parallaxVersion"
    }
}

//https://github.com/rafaskb/typing-label/wiki/Tokens#custom-effects

tasks.eclipse.doLast {
    delete ".project"
}