buildscript {

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        jcenter()
        google()
    }
    dependencies {
        
    }
}

allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"
	apply plugin: "distribution"

    version = '1.0'
    ext {
        appName = "Aboard"
        gdxVersion = '1.9.10'
        roboVMVersion = '2.3.5'
        box2DLightsVersion = '1.4'
        ashleyVersion = '1.7.0'
        aiVersion = '1.8.0'
        visuiVersion = '1.4.2'
        typingLabelVersion = '1.1.0'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        google()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
}


tasks.withType(JavaExec) {
    if (System.getProperty('DEBUG', 'false') == 'true') {
        jvmArgs '-Xdebug', '-Xrunjdwp:transport=dt_socket,server=y,suspend=y,address=9099'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}


project(":desktop") {
    apply plugin: "java"

    dependencies {
        compile project(":core")
     	compile "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        compile "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        compile "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
        compile "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
        compile "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-desktop"    
       
    }
}

project(":editor") {
    apply plugin: "java"

    dependencies {
        compile project(":core")
        compile project(":desktop")
    }
}

project(":test") {
    apply plugin: "java"

    dependencies {
        compile project(":core")
        compile project(":desktop")
        compile project(":editor")
    }
}

project(":core") {
    apply plugin: "java"

    dependencies {
        compile "com.badlogicgames.gdx:gdx:$gdxVersion"
        compile "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
        compile "com.badlogicgames.gdx:gdx-controllers-lwjgl3:$gdxVersion"
        compile "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        compile "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
  		compile "com.kotcrab.vis:vis-ui:$visuiVersion"
        compile 'org.apache.commons:commons-collections4:4.1'
        compile "com.badlogicgames.box2dlights:box2dlights:1.4"
     	compile "com.esotericsoftware:kryo:5.0.0-RC1"
     	compile "com.rafaskoberg.gdx:typing-label:$typingLabelVersion"
        compile group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.0.1'
        compile group: 'commons-io', name: 'commons-io', version: '2.4'
        compile group: 'org.apache.commons', name: 'commons-io', version: '1.3.2'
        compile fileTree(dir: 'jars', include: '*.jar')
    }
}

//https://github.com/rafaskb/typing-label/wiki/Tokens#custom-effects

tasks.eclipse.doLast {
    delete ".project"
}