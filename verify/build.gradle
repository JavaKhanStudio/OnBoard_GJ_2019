apply plugin: "java-library"

eclipse.project { name = appName + "-verify" }

dependencies {
    testImplementation project(":core")
    testImplementation project(":desktop")
    testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test') {
    // The GL test drives a real window, so it is opt-in: ./gradlew :verify:test -PwithGl
    useJUnitPlatform {
        if (!project.hasProperty('withGl')) excludeTags 'gl'
    }

    // One JVM per test class. The GL tests each boot a full Lwjgl3Application, and libGDX,
    // VisUI and the controller manager all keep static state that cannot be torn down and
    // set up again in the same process - VisUI.load() throws outright the second time.
    forkEvery = 1

    // Match how the game itself is launched, so Gdx.files resolves exactly as it does in play.
    workingDir = file('../desktop')

    if (project.hasProperty('recordGolden')) systemProperty 'onboard.golden.record', 'true'
    // The game resolves assets relative to desktop/, with assets/ on the classpath.
    systemProperty 'onboard.assets', file('../desktop/assets').absolutePath
    systemProperty 'onboard.root', rootDir.absolutePath
    systemProperty 'onboard.verify', projectDir.absolutePath
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
        showStandardStreams = false
    }
}
