<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>On Board</title>
	<!-- r165: without these the tab wears Java's Duke, which jwebserver serves for /favicon.ico. Both are
	     desktop/assets/ui/icon/logo_onboard.png centred on a square (never squashed, D3). -->
	<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
	<link rel="icon" sizes="16x16 32x32 48x48 64x64" href="favicon.ico">
	<link rel="apple-touch-icon" href="icon.png">
	<!-- r179: HtmlLauncher sizes the canvas to the largest 16:9 box in the tab; this only centres it on
	     black. Never size the canvas here: CSS would scale its pixels instead of the game drawing more (D3). -->
	<style>body { margin: 0; background: #000; overflow: hidden; }
		#embed-html { display: flex; justify-content: center; align-items: center; height: 100vh; }
		#embed-html canvas { display: block; }
		.gdx-preloader .logo { max-width: 80vw; max-height: 70vh; width: auto; height: auto; }
		.gdx-preloader .gdx-meter { margin: 0 auto; }</style>
	<script type="text/javascript" src="html/html.nocache.js"></script>
</head>
<body>
	<div id="embed-html"></div>
	<!-- r222: opened from a disk (file://) the browser refuses the game's files and the logo waits
	     forever. Say so instead, and where the drive's launcher is. -->
	<script>if (location.protocol === 'file:') document.body.innerHTML =
		'<p style="color:#ddd;font:20px/1.5 sans-serif;max-width:40em;margin:15vh auto;padding:0 1em">' +
		'Le navigateur ne lance pas le jeu depuis un disque. Revenez au dossier précédent et ouvrez ' +
		'« Jouer - Play » pour votre ordinateur.<br><br>' +
		'A browser will not run the game from a disk. Go back one folder and open ' +
		'"Jouer - Play" for your computer.</p><style>.gdx-preloader { display: none; }</style>';</script>
</body>
</html>
