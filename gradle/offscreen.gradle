// Offscreen by default: windows nobody is meant to watch get a display of their own.
//
// The GL tests each open a real window to get a GPU surface, and a board agent checking
// its work opens the game the same way. tools/offscreen.sh already ran such commands inside
// cage, a headless wlroots compositor - but only for whoever remembered to type it, so
// windows kept opening on Simon's desktop, in front of whatever he was doing.
//
// Here the build does it itself. One cage is started per build, the first time a task
// asks for it, and closed when the build ends, including a failed one. The task's JVM is
// pointed at it through WAYLAND_DISPLAY and DISPLAY, so rendering keeps the GPU.
//
//   offscreen(task, 'always')       the GL tests: nobody watches those
//   offscreen(task, 'unattended')   runGame, runEditor: offscreen for a board agent
//                                   (ATELIER_AGENT set); on the screen for anyone else,
//                                   including the board's own "Play it" buttons
//
// ONBOARD_NO_OFFSCREEN=1 puts the windows back when you want to watch, and the sound with
// them; ONBOARD_OFFSCREEN=1 sends an 'unattended' task offscreen for you too. Without cage
// (Windows, macOS, a Linux machine that lacks it) everything opens on the screen as it
// always did - but the sound still goes to a file, see captureAudio below.

import java.util.concurrent.CompletableFuture
import java.util.concurrent.TimeUnit

import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters

abstract class OffscreenDisplay implements BuildService<BuildServiceParameters.None>, AutoCloseable
{
	private Process cage
	private Map<String, String> display
	private String failure

	/**
	 * WAYLAND_DISPLAY and DISPLAY of a headless cage, started on first use. Null when there
	 * is no cage to start; throws when cage exists but will not come up, because quietly
	 * falling back to the real screen is exactly what this is here to stop.
	 */
	synchronized Map<String, String> display()
	{
		if (failure != null) throw new GradleException(failure)
		if (cage != null) return display

		// cage runs one client and exits with it. This client prints the display cage made
		// for it and then waits on stdin, so cage lives until close() hangs up - or until the
		// Gradle daemon dies, which closes the pipe just the same. Nothing is left behind.
		ProcessBuilder pb = new ProcessBuilder('cage', '--', 'sh', '-c',
			'printf "%s|%s\\n" "$WAYLAND_DISPLAY" "$DISPLAY"; exec cat >/dev/null')
		pb.environment().put('WLR_BACKENDS', 'headless')   // no output, nothing on screen
		pb.redirectError(ProcessBuilder.Redirect.DISCARD)
		try
		{
			cage = pb.start()
		}
		catch (IOException ignored)
		{
			return null   // cage is not installed
		}

		BufferedReader out = new BufferedReader(new InputStreamReader(cage.inputStream))
		String line = null
		try
		{
			line = CompletableFuture.supplyAsync { out.readLine() }.get(15, TimeUnit.SECONDS)
		}
		catch (Exception ignored) {}

		String[] parts = line?.split('\\|', -1)
		if (parts == null || parts.length != 2 || !parts[0] || !parts[1])
		{
			close()
			failure = 'cage is installed but did not start a headless display (got ' + line + '). ' +
				'Set ONBOARD_NO_OFFSCREEN=1 to open the windows on your screen instead.'
			throw new GradleException(failure)
		}
		display = [WAYLAND_DISPLAY: parts[0], DISPLAY: parts[1]]
		return display
	}

	@Override
	void close()
	{
		if (cage == null) return
		try { cage.outputStream.close() } catch (IOException ignored) {}
		if (!cage.waitFor(5, TimeUnit.SECONDS)) cage.destroyForcibly()
	}
}

def offscreenDisplay = gradle.sharedServices.registerIfAbsent('onboardOffscreenDisplay', OffscreenDisplay) {}

// Nobody is listening either. The music played out of Simon's speakers on every test that
// unmuted it, and on every run of the game an agent made to check its work.
//
// LWJGL ships OpenAL Soft, which takes its output from the environment: ALSOFT_DRIVERS=wave
// is a real playback device, running in real time, that writes a WAV file instead of
// reaching the sound card. The task hears nothing different - music plays, isPlaying()
// answers as it would - and what it played is left in build/audio/<task>.wav, where a test
// can check that sound came out (MusicTest does) and an agent can hand it back. The path
// is in ONBOARD_AUDIO_CAPTURE. It works on every OS, cage or not.
//
// A file per task, overwritten each run: about 10 MB a minute of play.
def captureAudio = { Task task, File dir ->
	dir.mkdirs()
	File wav = new File(dir, "${task.name}.wav")
	File conf = new File(dir, "${task.name}.alsoft.conf")
	// 16-bit stereo, so the file is simple to read back; the backend's default is float.
	conf.text = "# Written by gradle/offscreen.gradle for ${task.path}.\n" +
		"[general]\nsample-type = int16\nchannels = stereo\nfrequency = 44100\n\n" +
		"[wave]\nfile = ${wav.absolutePath}\n"
	task.environment(ALSOFT_DRIVERS: 'wave', ALSOFT_CONF: conf.absolutePath,
		ONBOARD_AUDIO_CAPTURE: wav.absolutePath)
	task.logger.lifecycle("offscreen: ${task.path} plays its sound into ${wav} rather than your speakers")
}

ext.offscreen = { Task task, String when ->
	task.usesService(offscreenDisplay)
	File audioDir = task.project.layout.buildDirectory.dir('audio').get().asFile
	task.doFirst {
		def env = System.getenv()
		if (env.ONBOARD_NO_OFFSCREEN == '1') return   // watching, and listening
		if (when == 'unattended' && !env.ATELIER_AGENT && env.ONBOARD_OFFSCREEN != '1') return

		captureAudio(task, audioDir)

		if (env.ONBOARD_INSIDE_CAGE == '1') return   // tools/offscreen.sh already put us in one
		if (!System.getProperty('os.name').toLowerCase().contains('linux')) return

		Map<String, String> display = offscreenDisplay.get().display()
		if (display == null)
		{
			task.logger.warn("offscreen: cage not found, so ${task.path} opens its windows on your screen")
			return
		}
		task.environment(display)
		task.logger.lifecycle("offscreen: ${task.path} renders to a headless display " +
			"(cage, ${display.WAYLAND_DISPLAY} / ${display.DISPLAY}); ONBOARD_NO_OFFSCREEN=1 to watch")
	}
}
